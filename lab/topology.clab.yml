# NetOps-SLM Milestone 1: Pinned 2-Router BGP Lab Topology
# Pinned to Containerlab official FRR & network-multitool images for rock-solid stability.
name: netops-bgp-lab

topology:
  nodes:
    # Router A (ASN 65001)
    router-a:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - config/router-a/daemons:/etc/frr/daemons
        - config/router-a/frr.conf:/etc/frr/frr.conf
        - config/router-a/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    # Router B (ASN 65002)
    router-b:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - config/router-b/daemons:/etc/frr/daemons
        - config/router-b/frr.conf:/etc/frr/frr.conf
        - config/router-b/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    # Endpoint A
    client-a:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - ip addr add 10.77.1.10/24 dev eth1
        - ip route replace 10.77.2.0/24 via 10.77.1.1

    # Endpoint B
    client-b:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - ip addr add 10.77.2.10/24 dev eth1
        - ip route replace 10.77.1.0/24 via 10.77.2.1

  links:
    - endpoints: ["client-a:eth1", "router-a:eth1"]
    - endpoints: ["router-a:eth2", "router-b:eth1"]
    - endpoints: ["router-b:eth2", "client-b:eth1"]
