frr version 8.5.2
hostname spine-2
log stdout informational
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description TO_LEAF_1
 ip address 10.77.0.6/30
!
interface eth2
 description TO_LEAF_2
 ip address 10.77.0.14/30
!
router bgp 65100
 bgp router-id 10.77.0.6
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.77.0.5 remote-as 65001
 neighbor 10.77.0.5 description PEER_LEAF_1
 neighbor 10.77.0.13 remote-as 65002
 neighbor 10.77.0.13 description PEER_LEAF_2
 !
 address-family ipv4 unicast
  neighbor 10.77.0.5 activate
  neighbor 10.77.0.13 activate
  maximum-paths 64
 exit-address-family
!
line vty
!
