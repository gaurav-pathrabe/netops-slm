frr version 8.5.2
hostname leaf-1
log stdout informational
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description TO_SPINE_1
 ip address 10.77.0.1/30
!
interface eth2
 description TO_SPINE_2
 ip address 10.77.0.5/30
!
interface eth3
 description TO_CLIENT_1
 ip address 10.77.1.1/24
!
router bgp 65001
 bgp router-id 10.77.1.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.77.0.2 remote-as 65100
 neighbor 10.77.0.2 description PEER_SPINE_1
 neighbor 10.77.0.6 remote-as 65100
 neighbor 10.77.0.6 description PEER_SPINE_2
 !
 address-family ipv4 unicast
  network 10.77.1.0/24
  neighbor 10.77.0.2 activate
  neighbor 10.77.0.6 activate
  maximum-paths 64
 exit-address-family
!
line vty
!
