frr version 8.5.2
hostname spine-1
log stdout informational
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description TO_LEAF_1
 ip address 10.77.0.2/30
!
interface eth2
 description TO_LEAF_2
 ip address 10.77.0.10/30
!
router bgp 65100
 bgp router-id 10.77.0.2
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.77.0.1 remote-as 65001
 neighbor 10.77.0.1 description PEER_LEAF_1
 neighbor 10.77.0.9 remote-as 65002
 neighbor 10.77.0.9 description PEER_LEAF_2
 !
 address-family ipv4 unicast
  neighbor 10.77.0.1 activate
  neighbor 10.77.0.9 activate
  maximum-paths 64
 exit-address-family
!
line vty
!
