frr version 8.5.2
frr defaults traditional
hostname router-b
log stdout informational
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.77.0.2/30
!
interface eth2
 ip address 10.77.2.1/24
!
router bgp 65002
 bgp router-id 10.77.0.2
 no bgp ebgp-requires-policy
 neighbor 10.77.0.1 remote-as 65001
 neighbor 10.77.0.1 description PEER_ROUTER_A
 !
 address-family ipv4 unicast
  network 10.77.2.0/24
  neighbor 10.77.0.1 activate
 exit-address-family
!
line vty
!
