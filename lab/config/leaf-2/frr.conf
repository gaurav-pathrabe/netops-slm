frr version 8.5.2
hostname leaf-2
log stdout informational
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description TO_SPINE_1
 ip address 10.77.0.9/30
!
interface eth2
 description TO_SPINE_2
 ip address 10.77.0.13/30
!
interface eth3
 description TO_CLIENT_2
 ip address 10.77.2.1/24
!
router bgp 65002
 bgp router-id 10.77.2.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.77.0.10 remote-as 65100
 neighbor 10.77.0.10 description PEER_SPINE_1
 neighbor 10.77.0.14 remote-as 65100
 neighbor 10.77.0.14 description PEER_SPINE_2
 !
 address-family ipv4 unicast
  network 10.77.2.0/24
  neighbor 10.77.0.10 activate
  neighbor 10.77.0.14 activate
  maximum-paths 64
 exit-address-family
!
line vty
!
